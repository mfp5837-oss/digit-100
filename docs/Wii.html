<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wii Home Menu</title>
        <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #f0f0f0;
      font-family: "Arial", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* 16:9 Wii Screen Container */
    .wii-container {
      width: 1350px;
      height: 650px;
      background: linear-gradient(to bottom, #fdfdfd 0%, #eaeaea 100%);
      border: 4px solid #4a4a4a;
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    /* 4x3 Channels Grid */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 16px 22px;
      height: 78%;
      width: 100%;
    }

    /* Individual Channel Box */
    .channel {
      background: linear-gradient(to bottom, #ffffff 0%, #f1f1f1 100%);
      border: 3px solid #b5b5b5;
      border-radius: 18px;
      box-shadow: 
        inset 0 0 10px rgba(255,255,255,0.8),
        0 4px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    /* Wii Hover Interactivity */
    .channel:hover {
      transform: scale(1.04);
      border-color: #4ac1ff;
      box-shadow: 
        0 0 15px rgba(74, 193, 255, 0.6),
        0 6px 12px rgba(0,0,0,0.1);
    }

    .channel:active {
      transform: scale(0.98);
      background: #e6e6e6;
    }

    /* Text Formatting inside Channels */
    .channel-title {
      font-size: 14px;
      font-weight: bold;
      color: #666;
      text-align: center;
      pointer-events: none;
    }

    .disc-spin {
      width: 50px;
      height: 50px;
      border: 4px dashed #999;
      border-radius: 50%;
      animation: spin 6s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 15%;
      width: 100%;
      padding-top: 10px;
    }

    /* Round System Buttons (Wii Option & Mail) */
    .wii-btn {
      width: 75px;
      height: 48px;
      background: linear-gradient(to bottom, #ffffff 0%, #e1e1e1 100%);
      border: 3px solid #b5b5b5;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      box-shadow: 0 3px 5px rgba(0,0,0,0.08);
      transition: all 0.1s ease;
    }

    .wii-btn:hover {
      border-color: #4ac1ff;
      background: #ffffff;
    }

    /* Center Page/Arrow Indicators */
    .page-indicator {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #e2e2e2;
      padding: 6px 30px;
      border-radius: 20px;
      border: 2px solid #ccc;
    }

    .arrow {
      font-size: 16px;
      color: #888;
      cursor: pointer;
      font-weight: bold;
    }
    
    .arrow:hover {
      color: #333;
    }

    .dot-container {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #b5b5b5;
      border-radius: 50%;
    }

    .dot.active {
      background-color: #666;
    }
  </style>
    </head>
    <body>
        
        <div class="wii-container">
            
            <!-- 4x3 Grid Area -->
            <div class="channels-grid">
                <!-- Row 1 -->
                <div class="channel">
                    <div class="disc-spin"></div>
                    <div class="channel-title">Disc Channel</div>
                </div>
                <div class="channel"><div class="channel-title">Mii Channel</div></div>
                <div class="channel"><div class="channel-title">Photo Channel</div></div>
                <div class="channel"><div class="channel-title">Wii Shop Channel</div></div>
                
                <!-- Row 2 -->
                <div class="channel"><div class="channel-title">Forecast Channel</div></div>
                <div class="channel"><div class="channel-title">News Channel</div></div>
                <div class="channel"><div class="channel-title">Internet Channel</div></div>
                <div class="channel"><div class="channel-title">Everybody Votes</div></div>
                
                <!-- Row 3 -->
                <div class="channel"><div class="channel-title">Virtual Console</div></div>
                <div class="channel"><div class="channel-title">WiiWare</div></div>
                <div class="channel"><div class="channel-title">Empty</div></div>
                <div class="channel"><div class="channel-title">Empty</div></div>
            </div>
            
            <!-- Bottom Wii Options Bar -->
            <div class="bottom-bar">
                <!-- Left Wii Options Button -->
                <div class="wii-btn" onclick="alert('Wii Options Opened')">Wii</div>
                
                <!-- Center Page Scroll -->
                <div class="page-indicator">
                    <span class="arrow">&lt;</span>
                    <div class="dot-container">
                        <div class="dot active"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span class="arrow">&gt;</span>
                </div>
                
                <!-- Right Mail Button -->
                <div class="wii-btn" onclick="alert('Wii Message Board Opened')">✉</div>
            </div>
            
        </div>
        
    </body>
</html>
